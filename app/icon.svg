<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003F37"/>
      <stop offset="100%" stop-color="#4F5338"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Simplified presentation board -->
  <rect x="7" y="6" width="18" height="14" rx="2" fill="none" stroke="white" stroke-width="1.8"/>
  <!-- Play triangle -->
  <polygon points="14,10 14,17 20,13.5" fill="white"/>
  <!-- Easel legs -->
  <line x1="12" y1="20" x2="9" y2="27" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="20" y1="20" x2="23" y2="27" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
</svg>
